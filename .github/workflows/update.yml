name: Update surf data

on:
  schedule:
    - cron: "17 * * * *"   # every hour, at :17
  workflow_dispatch:
    inputs:
      calendar:
        description: "Also rebuild the 6-month calendar data"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch data
        run: python scripts/fetch.py ${{ inputs.calendar && '--calendar' || '' }}
      - name: Commit
        run: |
          git config user.name "surf-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Data update $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase origin main
          git push

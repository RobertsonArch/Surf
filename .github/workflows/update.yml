name: Update surf data

on:
  schedule:
    - cron: "3-59/10 * * * *"   # every 10 minutes
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      calendar:
        description: "Also rebuild the 6-month calendar data"
        type: boolean
        default: false

permissions:
  actions: write
  contents: write
  pages: write
  id-token: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: update-and-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch data
        run: python scripts/fetch.py ${{ (inputs.calendar || github.event_name == 'push') && '--calendar' || '' }}
      - name: Save the buoy archive and calendar (once a day)
        continue-on-error: true   # never let a save problem stop the site from updating
        run: |
          H=$(TZ=America/Los_Angeles date +%H); M=$(date +%M)
          if [ "${{ github.event_name }}" = "push" ] || [ "${{ inputs.calendar }}" = "true" ] || { [ "$H" = "03" ] && [ "$M" -lt 10 ]; }; then
            git config user.name "surf-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            for i in 1 2 3; do
              # start from whatever is on main now, keeping this run's data files on top
              git fetch -q origin main && git reset -q --soft origin/main
              git add -f data/history data/cal_tides.json data/cal_currents.json
              if git diff --cached --quiet; then echo "Nothing to save"; exit 0; fi
              git commit -q -m "Daily archive $(date -u +%Y-%m-%d)"
              git push -q origin HEAD:main && exit 0
              sleep 5
            done
            exit 1
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      # A run cancelled mid-deploy can leave a Pages deployment stuck "in progress", which blocks every later deploy.
      - name: Clear stuck Pages deployments
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for sha in $(gh api "repos/${{ github.repository }}/deployments?environment=github-pages&per_page=10" -q '.[].sha' | sort -u); do
            [ "$sha" = "${{ github.sha }}" ] && continue
            gh api -X POST "repos/${{ github.repository }}/pages/deployments/$sha/cancel" >/dev/null 2>&1 || true
          done
      - id: deploy
        uses: actions/deploy-pages@v4
        timeout-minutes: 10

  # GitHub's own timer only fires every 30-60 min in practice, so after each
  # update this waits out the rest of the 10 minutes and starts the next one.
  # Only one of these waits at a time (a newer one replaces an older one), and
  # it doesn't block updates started by a push. The timer above stays as a
  # backup that restarts the chain if it ever breaks.
  next:
    needs: update
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: next-run
      cancel-in-progress: true
    steps:
      - name: Start the next update in about 10 minutes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 500
          gh workflow run update.yml --repo "${{ github.repository }}" --ref main

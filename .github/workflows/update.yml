name: Update surf data

on:
  schedule:
    - cron: "3-59/10 * * * *"   # every 10 minutes
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      calendar:
        description: "Also rebuild the 6-month calendar data"
        type: boolean
        default: false

permissions:
  actions: write
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-and-deploy
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch data
        run: python scripts/fetch.py ${{ inputs.calendar && '--calendar' || '' }}
      - name: Save the buoy archive and calendar (once a day)
        run: |
          H=$(TZ=America/Los_Angeles date +%H); M=$(date +%M)
          if [ "${{ github.event_name }}" != "schedule" ] || { [ "$H" = "03" ] && [ "$M" -lt 10 ]; }; then
            git config user.name "surf-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -f data/history data/cal_tides.json data/cal_currents.json
            if git diff --cached --quiet; then echo "Nothing to save"; exit 0; fi
            git commit -m "Daily archive $(date -u +%Y-%m-%d)"
            git pull --rebase origin main && git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
        timeout-minutes: 5
      # GitHub's own timer only fires every 30-60 min in practice, so each run
      # waits out the rest of its 10 minutes and then starts the next one.
      # (The timer above stays as a backup that restarts the chain if it breaks.)
      - name: Start the next run in about 10 minutes
        if: always() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 480   # the fetch and deploy above take about 1-2 minutes
          gh workflow run update.yml --repo "${{ github.repository }}" --ref main
